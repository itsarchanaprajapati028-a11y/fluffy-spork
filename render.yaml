services:
  - type: web
    name: fs01-backend
    runtime: node
    plan: free
    rootDir: FS-01-Ecommerce/backend
    buildCommand: npm install
    startCommand: npm run seed && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: rzp_test_demo_fs01000001
      - key: RAZORPAY_KEY_SECRET
        value: fs01_razorpay_demo_secret
      - key: RAZORPAY_DEMO
        value: "true"
      - key: RAZORPAY_CURRENCY
        value: USD

  - type: web
    name: fs03-backend
    runtime: node
    plan: free
    rootDir: FS-03-LMS/backend
    buildCommand: npm install
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  - type: web
    name: fs01-frontend
    runtime: static
    rootDir: FS-01-Ecommerce/frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://fs01-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: fs03-frontend
    runtime: static
    rootDir: FS-03-LMS/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: https://fs03-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: fs-homepage
    runtime: static
    buildCommand: >-
      mkdir -p dist && sed
      -e "s|http://localhost:5173|https://fs01-frontend.onrender.com|g"
      -e "s|http://localhost:5174|https://fs03-frontend.onrender.com|g"
      -e "s|http://localhost:5000|https://fs01-backend.onrender.com|g"
      -e "s|http://localhost:5001|https://fs03-backend.onrender.com|g"
      homepage.html > dist/index.html
    staticPublishPath: dist
